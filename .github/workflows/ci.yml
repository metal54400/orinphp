name: OrinPHP CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:
  test:
    name: Node.js ${{ matrix.node }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node:
          - 20
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Check package
        run: npm pack --dry-run
