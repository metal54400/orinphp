name: Publish OrinPHP

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:

    name: Publish to npm

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check package
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public